title: Support the Center of Trial and Error
description: Help keep our journals free to read and free to publish in.
showTitle: true
sections:
  - type: text
    body: |-
      The Center of Trial and Error promotes open science, first of all through our diamond open access journals: the [Journal of Trial and Error](/journal) and the [Journal for Reproducibility in Neuroscience](/jrn). We publish research across the full range of scientific inquiry, and value transparency and learning from every outcome.
    background: paper

  - type: donate
    title: Make a donation
    text: |-
      A one-time donation goes through Stripe. You can also transfer to our bank account directly. As a Dutch charity with ANBI status, gifts to us may be tax deductible in the Netherlands ([legal status](/legal-status)).
