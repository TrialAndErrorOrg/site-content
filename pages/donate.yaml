  - type: text
    title: Why we need your support
    body: |-
      Diamond open access means our journals are free to read and free to publish in, so money is never what stops knowledge from being shared. Keeping it that way takes resources:

      - **Running costs**: from modest reimbursements for our team to the digital infrastructure the journals run on.
      - **No publication fees**: your support lets researchers anywhere share their findings, and read others' work, for free.
      - **New initiatives**: new projects that promote open science and widen the reach of research.

      Your contribution helps a culture of transparency and collaboration that scientific progress depends on.
    background: paper

  - type: supporters
    title: With thanks to
    intro: The organisations and people whose support keeps the Center going.
