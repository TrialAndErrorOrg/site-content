title: Editorial Team
description: The editorial board and editorial office of the Journal of Trial and Error.
showTitle: true
sections:
  - type: editorial-board
    intro: >-
      The editorial board handles submissions to the Journal of Trial and Error. The editorial
      office runs the journal and prepares accepted articles for publication. To submit an article,
      use our [submission portal](https://submit.trialanderror.org/jote). For questions about a
      (possible) submission, email [info@trialanderror.org](mailto:info@trialanderror.org).
