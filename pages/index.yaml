title: Center of Trial and Error
description: Creating transparent and responsible scholarship.
sections:
  - type: hero
    # Each line becomes its own box
    title: |-
      Center of
      Trial & Error.
    subtitle: Creating transparent and responsible scholarship.
    text: >-
      We are a non-profit organization experimenting with innovative publishing activities.
      The Center provides a space for independent reflection on academic practice and
      stimulates students and early career researchers to disrupt existing scholarly
      infrastructures.
    buttons:
      - label: What we do
        url: "#what-we-do"
      - label: Meet the team
        url: /about#team
        style: plain

  - type: features
    id: what-we-do
    title: What we do
    items:
      - title: Publishing
        color: journal
        body: >-
          We define “trial and error” as methodological flaws and conceptual errors in research.
          The **Journal of Trial and Error** publishes them: null results, failed replications and
          reflections on what went wrong, free to read and free to publish.
        link: { label: Read the journal, url: /journal }
      - title: Discussing
        color: blog
        body: >-
          On **A Blog of Trial and Error** researchers, editors and students write about failure in
          academia, open science, and what it takes to run a diamond open-access journal.
        link: { label: Read the blog, url: /blog }
      - title: Gathering
        color: accent
        body: >-
          Institutional change starts with well-equipped young researchers. We organise symposia,
          talks and workshops on how science is done, published and rewarded.
        link: { label: See our events, url: /events }

  - type: latest-articles
    title: From the Journal
    count: 6
    style: featured

  - type: latest-posts
    title: From the Blog
    count: 5

  - type: events
    title: Events
    count: 2

