summary: Melpomeni (Melina) Antonakaki is doctoral candidate at the Department of Science, Technology and Society (Technical University of Munich) and member of the Laboratory for Environment │Human Relations at the Institute of European Ethnology (Humboldt Universität zu Berlin). She researches how practices of investigating research misconduct intercept and intersect with practices of experimental replication in the life sciences, including bioengineering/materials science. She studies controversies that erupt at this intersection, and new types of epistemic activism that exploit dynamics therein, in pursuit of research culture reforms and access at evaluative contexts.
