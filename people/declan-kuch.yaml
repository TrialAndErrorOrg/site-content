summary: "'Dr Declan Kuch is an Adjunct Research Fellow at the Institute for Culture & Society at Western Sydney University and the Net Zero Social Research Lead at NSW Dept of Climate Change, Energy, Environment and Water. He is a Science and Technology Studies scholar whose research examines how emerging technologies gain legitimacy, trust and public acceptance. His work on automation, energy systems and climate governance connects critical analysis with institutional design, helping build fairer and more accountable futures.'"
