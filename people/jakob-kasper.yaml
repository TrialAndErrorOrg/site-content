summary: "**Jakob Kasper** is a third-year PhD candidate at the Amsterdam School of Communication Research (ASCoR), affiliated with the MSCA doctoral network ‘Interdisciplinary Perspectives on the Politics of Adolescence and Democracy’ and the HotPoliticsLab. His work centers on affective polarization. He investigates how it can be measured in multi-party systems, how research in political science can be bridged with psychological theories of affect to better capture the ‘affective’ nature of polarization, and how affective polarization develops during adolescence. Before joining ASCoR, Jakob received a Bachelor’s and Master’s degree in Psychology from the University of Heidelberg (Germany) and spent one year as a graduate exchange student at Cornell University (USA)."
