summary: Nicole is an Associate Professor in the Department of Medical History and Bioethics at the University of Wisconsin–Madison. She is a science and technology studies scholar who studies research cultures in the biomedical sciences, with an emphasis on method and infrastructure reform. She is a former Editor of the journal *Social Studies of Science* and currently serves as Chair of the Publications Committee for the Society for the Social Studies of Science.
