summary: '[Sergio Sismondo](http://www.sismondo.ca/ "http://www.sismondo.ca/") (Queen’s University, Canada) is editor of [*Social Studies of Science*](https://journals.sagepub.com/home/sss "https://journals.sagepub.com/home/sss"). He is the author of [*An Introduction to Science and Technology Studies*](https://www.wiley.com/en-us/An+Introduction+to+Science+and+Technology+Studies%2C+2nd+Edition-p-9781405187657 "https://www.wiley.com/en-us/An+Introduction+to+Science+and+Technology+Studies%2C+2nd+Edition-p-9781405187657"), as well as some other general or theoretical works in the field. For a number of years Sismondo’s empirical research has been on how the pharmaceutical industry creates and shapes the knowledge landscapes on which it operates; see his [Ghost-Managed Medicine: Big Pharma’s Invisible Hands](https://www.matteringpress.org/books/ghost-managed-medicine "https://www.matteringpress.org/books/ghost-managed-medicine").'
