summary: Anne Clinio (she/her) holds an MSc and PhD in Information Science from the Federal University of Rio de Janeiro (UFRJ). She is a researcher, member of the Education, Information, and Communication Vice Presidency team of Fundação Oswaldo Cruz (Fiocruz), Brazil. She is a member of the research groups Open Science and Citizen Innovation Laboratory (CindaLab), ScholCommLab and Intellecti.
