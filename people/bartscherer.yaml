summary: Sheena F. Bartscherer is a senior researcher at the Robert K. Merton Center for Science Studies, currently working on mapping global replication networks and the discursive layer surrounding the Open Science movement. She has also worked as a research and teaching assistant at the School for Library & Information Science as well as the School for Social Sciences, department of science studies at Humboldt-Universität zu Berlin. Additionally, she has worked at the Carl Friedrich von Weizsäcker Center at the Universität Tübingen in a VW Foundation grant-project, researching the drastic (and subliminal) changes in living and working conditions for academics during the Covid pandemic. Her general research interest lies in discourse research, primarily of scientific and political discourses past and present.
