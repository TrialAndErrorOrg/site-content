summary: |-
  ​Peter A.G. van Bergeijk is Professor Emeritus of International Economics and Macroeconomics at the International Institute of Social Studies, Erasmus University Rotterdam. He has held prominent roles including chief economist at the Dutch central bank and the Ministry of Economic Affairs. His research encompasses world trade, economic sanctions, diplomacy, and development, with publications in journals such as the *_Journal of Peace Research_* and *_World Development_*.

  Recently, he published his book "On the Inaccuracies of Economic Observation": post: <https://blog.trialanderror.org/video_professor_peter_bergeijk_economics>
