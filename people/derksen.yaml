summary: Maarten Derksen is Associate Professor in Theory and History of Psychology at the University of Groningen. He wrote Histories of Human Engineering (Cambridge University Press, 2017), about the dynamic of control in resistance in psychological practices. He is currently working together with Jonna Brenninkmeijer, Stephanie Meirmans, and Jeannette Pols, involved in the research project Replication in Practice, funded by the Dutch Research Council. The team blogs about the project at [*https://replicationinaction.blog/*](https://replicationinaction.blog/)
