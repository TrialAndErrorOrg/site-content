summary: "****Bert Bakker**** is an Associate Professor at the Amsterdam School of Communication Research (ASCoR) and Open Science Coordinator at the University of Amsterdam. He is co-director of the Hot Politics Lab, where he combines political psychology with adjacent fields to study salient socio-political phenomena. His research focuses on topics such as populism, political polarization, and the role of emotions in politics. Bert has a strong interest in open science and actively implements practices such as preregistration, replication, and transparent research workflows in his work. His research has been published in general science journals (*Nature Human Behaviour*), political science journals (*American Political Science Review*, *The Journal of Politics*), communication journals (*Journal of Communication*, *Media and Communication*), and psychology journals (*Political Psychology*, *Emotion*, *Journal of Personality*). His research is currently supported by grants from the European Commission and the Dutch Research Council (NWO)."
