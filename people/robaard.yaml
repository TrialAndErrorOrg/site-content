summary: Meike is PhD candidate in Comparative Literature at Emory University in Atlanta (USA), with a primary interest in the intersection of cultural imaginaries and histories of science, particularly concerning biopolitics, ecocriticism, and environmental humanities. Meike holds a B.A. and M.A. in American Studies from the University of Groningen, as well as an honors degree in Philosophy.
