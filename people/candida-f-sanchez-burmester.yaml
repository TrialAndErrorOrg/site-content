summary: "Candida F. Sánchez Burmester is a PhD student at Maastricht University and member of the ERC-synergy project ‘NanoBubbles: how, when and why does science fail to correct itself?’. She combines historical and ethnographic methods to analyze a controversy in nanobiology about how nanoparticles enter cells. She observes discussions on this topic at nanobio-conferences and is doing laboratory ethnography with a team of scientists who are replicating influential experiments. Using archival conference material, she contextualizes these discussions historically and traces the emergence of nanotoxicology."
