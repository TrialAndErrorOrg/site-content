summary: Maha is a postdoctoral researcher on the NanoBubbles (ERC Synergy project) replication subproject that investigates reproducibility in the nanoscience. She is a trained cellular and molecular biologist with a Ph.D. from Universite Paris Saclay. Aside her bench work Maha works on metascience in general and on research-integrity in particular.
