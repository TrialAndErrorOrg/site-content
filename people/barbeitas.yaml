summary: "Mady Barbeitas is a postdoctoral researcher in NanoBubbles: How, When, and Why Does Science Fail to Correct Itself?, a project funded by the European Research Council (ERC) through a Synergy Grant under the European Union’s Horizon 2020 programme (grant agreement no. 951393). She is also an assistant professor at Sciences Po in Paris, where she teaches courses in Science and Technology Studies. Her research focuses on scientific movements, biomedical research, and their impact on society."
