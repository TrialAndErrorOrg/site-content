summary: Bart Penders is associate professor in Biomedicine & Society at Maastricht University. He studies how scientists establish and maintain credibility for their claims through framing, rhetoric, and social, moral and political alliances. He is interested in collaboration and integrity and studies these dynamics in multiple settings, with a preference for contested epistemic domains, such as nutrition and food sciences and scientific reform. [@penders.bsky.social](https://bsky.app/profile/penders.bsky.social)
