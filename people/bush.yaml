summary: "Short biography: Martin Bush is Senior Lecturer in History and Philosophy of Science at the University of Melbourne. Martin is both a metascientific researcher and a cultural historian of science. He has expertise in popular astronomy in Australia, visual communication of science, the British popularisers Richard and Mary Proctor and the science communication work of the Ngarrindjeri Australian David Unaipon. Martin is part of the MetaMelb lab with metaresearch interests in public trust in science, policy applications of scientific research and the qualitative analysis of expert reasoning."
