summary: Laurien Hakvoort has been a music therapist since 1994 and has worked as a music therapist in forensic psychiatry for seventeen years, and currently runs a private practice. She is a music therapy lecturer on the bachelor's and (pre-)master's programmes at ArtEZ University of the Arts, and a freelance researcher.
